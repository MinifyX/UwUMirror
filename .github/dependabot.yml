version: 2

# Patch and minor arrive as one pull request per ecosystem. Ungrouped, a quiet
# week still means a dozen branches, each with its own CI run, all of them
# saying "bumps 6.4.1 to 6.4.2".
#
# Majors are ignored outright. Switching this file on produced eighteen of them
# in one minute — TypeScript 5 to 7, Vite 5 to 8, React 18 to 19, thiserror 1 to
# 2 — none of which is a thing you merge without reading a changelog, and all of
# which would sit there going stale and re-running CI on every push. A major is
# a small project of its own: do it deliberately, with
# `pnpm update <name> --latest` or `cargo upgrade`, when there is a reason to.
#
# The cost is that a major carrying a security fix needs noticing by hand, and
# UwUMirror is not an offline app: it listens on the local network and parses
# what phones send it. So the repository's Dependabot alerts stay on, and an
# alert about a crate or package on that path — mdns-sd, the AirPlay and adb
# code's dependencies, tokio — is read the day it comes, major or not.
#
# Written out per ecosystem rather than with a YAML anchor on purpose: this file
# is validated against a schema that does not know about a top-level block to
# anchor from, and a config Dependabot rejects is a config that silently does
# nothing at all.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      actions:
        update-types:
          - minor
          - patch
        # Every action is pinned to a commit, which Dependabot keeps current by
        # reading the tag the pin used to name. `dtolnay/rust-toolchain` has no
        # real tags — `stable` is a branch — so a bump of that one is a bump of
        # somebody's branch head and wants reading, not merging with eleven
        # other lines.
        exclude-patterns:
          - dtolnay/rust-toolchain

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      root:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      desktop:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /apps/setup
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      setup:
        update-types:
          - minor
          - patch

  # Cargo counts a 0.x bump as a major, which is most of what the Rust side
  # gets: mdns-sd, parking_lot and the Tauri plugins' helpers have been 0.x
  # for years. Those come through by hand with the rest.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      crates:
        update-types:
          - minor
          - patch
