name: CI

# The checks from `docs/architecture.md` on every push to main and every pull
# request, so nothing lands untested between two releases: Prettier and the
# locale check, the type check and the front-end builds once, then rustfmt,
# clippy and the Rust tests on Windows and Linux, side by side. The Rust jobs
# install no Node and build no front end: tauri-build only wants frontendDist
# to exist. Their caches are written by main only, and installers.yml's
# checks start from them for a tag. macOS is checked by `installers.yml` for
# every tag and every `ci/**` branch.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'release-notes/**'
      - 'brand/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'release-notes/**'
      - 'brand/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Front end
    runs-on: ubuntu-latest
    steps:
      # Every `uses:` is pinned to a commit, with the version in the comment: a
      # tag can be moved, and `@stable` is a branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Takes pnpm's version from package.json's packageManager; no corepack.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm -r build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cache: linux
          - os: windows-latest
            cache: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libasound2-dev: the ALSA headers cpal builds against, for the
          # mirrored sound.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev libssl-dev libasound2-dev pkg-config

      # tauri-build wants every app's frontendDist to exist; checking needs no
      # real build (ci.yml builds and typechecks the pages), and no Node
      # install. scrcpy's server is a bundle resource, fetched and checked by
      # hash with the runner's own Node.
      - name: Placeholder front ends and scrcpy-server
        shell: bash
        run: |
          for app in desktop setup; do
            mkdir -p apps/$app/dist && echo '<!doctype html>' > apps/$app/dist/index.html
          done
          node scripts/fetch-scrcpy-server.mjs

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # installers.yml's check on the same system takes this cache for a tag.
          shared-key: ${{ matrix.cache }}
          # Pull requests read main's cache but don't write their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
