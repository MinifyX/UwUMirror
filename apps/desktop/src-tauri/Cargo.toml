[package]
name = "uwumirror-desktop"
description = "UwUMirror desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "uwumirror_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
uwumirror-airplay.workspace = true
uwumirror-android.workspace = true
uwumirror-core.workspace = true
uwumirror-miracast.workspace = true

parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Shared buffers, for Miracast's decoded pictures (see `frames.rs`): the
# versions Tauri's own WebView2 binding uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
