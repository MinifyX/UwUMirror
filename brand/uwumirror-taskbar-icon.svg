<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="UwUMirror: a hand mirror with cat ears">
  <title>UwUMirror</title>
  <!--
    Taskbar, window and Linux menus: the hand mirror alone, upright, no tile,
    no phone and no face, so it fills the square and still reads as a mirror
    at 32 px. The ears say Nyu; the shine across the glass says mirror.
  -->
  <g stroke="#4B1D3F" stroke-width="3.5" stroke-linejoin="round">
    <path d="M12 22 L15 4 L27 13 Z" fill="#FF6FA6"/>
    <path d="M37 13 L49 4 L52 22 Z" fill="#FF6FA6"/>
    <rect x="27" y="44" width="10" height="17" rx="4" fill="#FF6FA6"/>
    <ellipse cx="32" cy="27" rx="24" ry="20" fill="#FF6FA6"/>
    <ellipse cx="32" cy="28" rx="16" ry="13" fill="#FFD3E5" stroke-width="2.5"/>
  </g>
  <path d="M22 25 Q24 19 30 17" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
</svg>
