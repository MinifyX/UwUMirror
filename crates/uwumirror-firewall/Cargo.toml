[package]
name = "uwumirror-firewall"
description = "UwUMirror's own Windows Firewall rules: checked without, set up with one administrator prompt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Shared by the app and the setup. Small on purpose: the setup must not pull
# in the app's sound and video crates for it. Elsewhere than on Windows there
# is nothing to set up, and only the types are left.
[dependencies]
serde.workspace = true

# The `windows` version is the one the setup and UwUCast use already.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_WindowsFirewall",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
